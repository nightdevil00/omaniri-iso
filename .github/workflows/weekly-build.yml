name: Weekly ISO Build

on:
  schedule:
    - cron: "1 0 * * 0"
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Prepare Build Environment
        run: |
          chmod +x bin/omaniri-iso-make builder/build-iso.sh
          docker info

      - name: Build ISO Image
        run: ./bin/omaniri-iso-make --no-cache --no-boot-offer

      - name: Read Version Information
        id: version
        run: |
          VERSION=$(curl -fsSL https://raw.githubusercontent.com/niraletter/omaniri/main/version)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omaniri-iso-v${{ steps.version.outputs.VERSION }}-${{ github.run_number }}
          path: release/*.iso
          retention-days: 30
